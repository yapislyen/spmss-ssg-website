<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements</title>

  <link rel="stylesheet" href="style.css">

  <script>
    if (sessionStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }

    function goLogin() {
      window.location.href = "login.html";
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("email");
      window.location.href = "login.html";
    }
  </script>
</head>

<body>

<header class="navbar">
  <h1>Announcements</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="announcements.html">Announcements</a>
    <a href="calendar.html">Calendar</a>
    <a href="finance.html">Finance</a>
    <a href="documents.html">Documents</a>
  </nav>

  <div class="auth-buttons">
    <button onclick="goLogin()">Officer Login</button>
    <button onclick="logout()" id="logoutBtn" style="display:none;">Logout</button>
  </div>
</header>

<main class="page">

  <section class="hero">
    <h2>📢 Latest Announcements</h2>
  </section>

  <!-- POST BOX -->
  <section class="announcement-form" id="postBox">
    <h3>➕ Post New Announcement</h3>

    <input type="text" id="title" placeholder="Announcement title">
    <textarea id="content" placeholder="Announcement content"></textarea>
    <button onclick="addAnnouncement()">Post</button>
  </section>

  <!-- FEED -->
  <section id="announcementList"></section>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZP1CZVJgFLWdxypAyNB2Iqxf3I-zt8y0",
    authDomain: "spmss-ssg-hub.firebaseapp.com",
    projectId: "spmss-ssg-hub",
    storageBucket: "spmss-ssg-hub.firebasestorage.app",
    messagingSenderId: "399203282033",
    appId: "1:399203282033:web:96587b2e0fb9b2eab93fd0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const role = sessionStorage.getItem("role");
  const email = sessionStorage.getItem("email");

  window.onload = function () {
    const postBox = document.getElementById("postBox");
    const logoutBtn = document.getElementById("logoutBtn");

    if (logoutBtn) logoutBtn.style.display = "inline-block";

    if (role === "student" && postBox) {
      postBox.style.display = "none";
    }
  };

  // ➕ ADD ANNOUNCEMENT
  window.addAnnouncement = async function () {
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;

    if (!title || !content) return;

    await addDoc(collection(db, "announcements"), {
      title,
      content,
      time: new Date().toLocaleString(),
      role,
      author: email
    });

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";

    loadAnnouncements();
  };

  // 📥 LOAD ANNOUNCEMENTS (UI UPGRADED)
  async function loadAnnouncements() {
    const list = document.getElementById("announcementList");
    list.innerHTML = "";

    const q = query(collection(db, "announcements"), orderBy("time", "desc"));
    const snapshot = await getDocs(q);

    snapshot.forEach((docSnap) => {
      const a = docSnap.data();

      const div = document.createElement("div");
      div.classList.add("ann-card");

      div.innerHTML = `
        <h3>${a.title}</h3>
        <p>${a.content}</p>

        <small>
          Posted by: ${a.role} (${a.author}) <br>
          ${a.time}
        </small>
      `;

      list.appendChild(div);
    });
  }

  loadAnnouncements();
</script>

</body>
</html>
